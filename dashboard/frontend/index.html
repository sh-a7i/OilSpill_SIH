<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maritime Pollution Forensics</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root {
    --ink: #0b1420;
    --panel: #101c2c;
    --panel-raised: #16273b;
    --line: #23374d;
    --text: #dbe6f0;
    --text-dim: #7d94ab;
    --amber: #e0a458;
    --cyan: #4fd1c5;
    --red: #e0645a;
    --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
  }

  #app {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: 56px 1fr;
    height: 100vh;
  }

  header {
    grid-column: 1 / 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  header .title {
    font-size: 15px;
    letter-spacing: 0.02em;
    font-weight: 600;
  }
  header .title span { color: var(--text-dim); font-weight: 400; margin-left: 10px; }

  select#caseSelect {
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 12.5px;
  }

  #map { width: 100%; height: 100%; background: #0b1420; }

  #side {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .block {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }

  .block h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 10px 0;
    font-weight: 600;
  }

  .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .stat-row .k { color: var(--text-dim); }
  .stat-row .v { font-family: var(--mono); }

  .vessel-card {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .vessel-card:hover { border-color: var(--cyan); }
  .vessel-card.active { border-color: var(--amber); background: #1c2c40; }

  .vessel-card .row1 { display: flex; justify-content: space-between; align-items: baseline; }
  .vessel-card .rank { color: var(--text-dim); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
  .vessel-card .name { font-size: 13.5px; font-weight: 600; }
  .vessel-card .score { font-family: var(--mono); font-size: 15px; color: var(--amber); }
  .vessel-card .conf { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 2px; }

  .bar-row { margin: 8px 0; }
  .bar-row .label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; }
  .bar-track { height: 6px; background: #0b1420; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); }

  .explanation { font-size: 12.5px; line-height: 1.5; color: var(--text-dim); padding: 4px 0; }
  .gap-flag { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--red); font-family: var(--mono); }

  .back-link { font-size: 12px; color: var(--cyan); cursor: pointer; margin-bottom: 10px; display: inline-block; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .leaflet-popup-content-wrapper { background: var(--panel-raised); color: var(--text); }
  .leaflet-popup-tip { background: var(--panel-raised); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">MARITIME POLLUTION FORENSICS <span id="obsTime"></span></div>
    <select id="caseSelect"></select>
  </header>
  <div id="map"></div>
  <div id="side"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const API = "http://127.0.0.1:8000";

const map = L.map('map', { zoomControl: true }).setView([19.0, 72.6], 10);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri',
  maxZoom: 16
}).addTo(map);

let layerGroup = L.layerGroup().addTo(map);
let activeVesselId = null;
let currentCase = null;

const colors = { spill: '#e0645a', origin: '#ffd166', drift: '#4fd1c5', vessel: '#dbe6f0', active: '#e0a458' };

async function loadCases() {
  const res = await fetch(`${API}/api/cases`);
  const cases = await res.json();
  const sel = document.getElementById('caseSelect');
  sel.innerHTML = cases.map(c =>
    `<option value="${c.slick_id}">${c.slick_id} — top score ${c.top_score}</option>`
  ).join('');
  sel.addEventListener('change', () => loadCase(sel.value));
  if (cases.length) loadCase(cases[0].slick_id);
}

async function loadCase(slickId) {
  const res = await fetch(`${API}/api/case/${slickId}`);
  currentCase = await res.json();
  activeVesselId = null;
  document.getElementById('obsTime').textContent = currentCase.observation_time || '';
  renderMap();
  renderSide();
}

function renderMap() {
  layerGroup.clearLayers();
  const c = currentCase;
  const bounds = [];

  if (c.spill.geometry) {
    const gj = L.geoJSON(c.spill.geometry, {
      style: { color: colors.spill, weight: 2, fillOpacity: 0.25 }
    }).addTo(layerGroup);
    gj.eachLayer(l => bounds.push(l.getBounds()));
  }

  if (c.origin && c.origin.centroid) {
    const o = c.origin.centroid;
    L.circleMarker([o.lat, o.lon], { radius: 7, color: colors.origin, fillColor: colors.origin, fillOpacity: 0.9 })
      .bindPopup(`Estimated origin<br>${c.origin.estimated_spill_time_utc || ''}`)
      .addTo(layerGroup);
    bounds.push(L.latLngBounds([[o.lat, o.lon]]));
  }

  if (c.hindcast_path && c.hindcast_path.lats) {
    const pts = c.hindcast_path.lats.map((lat, i) => [lat, c.hindcast_path.lons[i]]).filter(p => p[0] != null && p[1] != null);
    if (pts.length) {
      L.polyline(pts, { color: colors.drift, weight: 2, dashArray: '4 4' }).addTo(layerGroup);
      bounds.push(L.latLngBounds(pts));
    }
  }

  if (c.forecast_path && c.forecast_path.lats) {
    const pts = c.forecast_path.lats.map((lat, i) => [lat, c.forecast_path.lons[i]]).filter(p => p[0] != null && p[1] != null);
    if (pts.length) {
      L.polyline(pts, { color: colors.drift, weight: 2 }).addTo(layerGroup);
      bounds.push(L.latLngBounds(pts));
    }
  }

  c.vessels.forEach(v => {
    const track = (v.track || []).filter(p => p.latitude != null && p.longitude != null);
    if (!track.length) return;
    const isActive = v.vessel_id === activeVesselId;
    const pts = track.map(p => [p.latitude, p.longitude]);
    L.polyline(pts, { color: isActive ? colors.active : colors.vessel, weight: isActive ? 3 : 1, opacity: isActive ? 1 : 0.35 }).addTo(layerGroup);
    const last = track[track.length - 1];
    L.circleMarker([last.latitude, last.longitude], {
      radius: isActive ? 6 : 4,
      color: isActive ? colors.active : colors.vessel,
      fillColor: isActive ? colors.active : colors.vessel,
      fillOpacity: 0.9
    }).bindPopup(`#${v.rank} ${v.vessel_name}<br>Score: ${v.overall_score}`).addTo(layerGroup);
    if (isActive) bounds.push(L.latLngBounds(pts));
  });

  if (bounds.length) {
    let combined = bounds[0];
    bounds.forEach(b => combined = combined.extend(b));
    map.fitBounds(combined, { padding: [40, 40] });
  }
}

function renderSide() {
  const c = currentCase;
  const side = document.getElementById('side');

  if (activeVesselId) {
    const v = c.vessels.find(v => v.vessel_id === activeVesselId);
    side.innerHTML = `
      <div class="block">
        <span class="back-link" onclick="deselectVessel()">&larr; back to suspects</span>
        <h2>${v.vessel_name}</h2>
        <div class="stat-row"><span class="k">MMSI</span><span class="v">${v.vessel_id}</span></div>
        <div class="stat-row"><span class="k">Type</span><span class="v">${v.vessel_type || '—'}</span></div>
        <div class="stat-row"><span class="k">Overall score</span><span class="v" style="color:var(--amber)">${v.overall_score}</span></div>
        <div class="stat-row"><span class="k">Confidence</span><span class="v">${v.confidence}</span></div>
      </div>
      <div class="block">
        <h2>Evidence breakdown</h2>
        ${Object.entries(v.evidence || {}).map(([k, val]) => bar(k, val)).join('')}
      </div>
      <div class="block">
        <h2>Explanation</h2>
        ${(v.explanation || []).map(e => `<div class="explanation">• ${e}</div>`).join('')}
        ${v.gaps && v.gaps.length ? `<div class="gap-flag">⚠ ${v.gaps.length} AIS gap(s) detected</div>` : ''}
      </div>
    `;
  } else {
    side.innerHTML = `
      <div class="block">
        <h2>Spill summary</h2>
        <div class="stat-row"><span class="k">Case</span><span class="v">${c.slick_id}</span></div>
        <div class="stat-row"><span class="k">Area</span><span class="v">${c.spill.area_km2 ?? '—'} km²</span></div>
        <div class="stat-row"><span class="k">Detection conf.</span><span class="v">${c.spill.confidence != null ? Math.round(c.spill.confidence * 100) + '%' : '—'}</span></div>
        <div class="stat-row"><span class="k">Origin est.</span><span class="v">${c.origin ? c.origin.estimated_spill_time_utc : '—'}</span></div>
      </div>
      <div class="block" style="flex:1;">
        <h2>Ranked suspects (${c.vessels.length})</h2>
        ${c.vessels.map(v => `
          <div class="vessel-card" onclick="selectVessel('${v.vessel_id}')">
            <div class="row1">
              <div><span class="rank">#${v.rank}</span><span class="name">${v.vessel_name}</span></div>
              <div class="score">${v.overall_score}</div>
            </div>
            <div class="conf">${v.confidence} confidence</div>
          </div>
        `).join('')}
      </div>
    `;
  }
}

function bar(label, value) {
  const rounded = Math.round(value * 10) / 10;
  return `
    <div class="bar-row">
      <div class="label"><span>${label}</span><span>${rounded}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, rounded))}%"></div></div>
    </div>
  `;
}

function selectVessel(id) { activeVesselId = id; renderMap(); renderSide(); }
function deselectVessel() { activeVesselId = null; renderMap(); renderSide(); }

loadCases();
</script>
</body>
</html>
